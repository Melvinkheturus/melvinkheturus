<svg viewBox="0 0 1000 370" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience — MergeX, Dutuk, Zukun Academy, University of Madras">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --dim: #AAAAAA; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --dim: #666666; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
    :root { --bone:#FFFFFF; --muted:#AAAAAA; --dim:#666666; --rule:#444444; --accent:#818cf8; --node-bg:#000000; --core-bg:#000000; --ghost:#FFFFFF; --ink:#FFFFFF; --paper:#000000; }
  </style>

  <line x1="120" y1="10" x2="120" y2="360" stroke="var(--rule)" stroke-width="1" opacity=".4"/>

  <g class="rise a1">
    <text class="mono" x="48" y="42"  font-size="12" fill="var(--accent)" letter-spacing="2">2025 –</text>
    <text class="mono" x="136" y="42"  font-size="15" fill="var(--bone)">MergeX · Founder &amp; CEO · Chennai</text>
    <text class="mono" x="136" y="68"  font-size="14" fill="var(--muted)">built MergeX Sales OS — AI-powered CRM &amp; sales automation engine from scratch</text>
    <text class="mono" x="136" y="90"  font-size="14" fill="var(--muted)">multi-agent AI workflows · Neon PostgreSQL · Next.js · automated outreach pipelines</text>
  </g>

  <g class="rise a2">
    <text class="mono" x="48" y="138" font-size="12" fill="var(--accent)" letter-spacing="2">2024 –</text>
    <text class="mono" x="136" y="138" font-size="15" fill="var(--bone)">Dutuk · Full Stack Developer · Chennai</text>
    <text class="mono" x="136" y="164" font-size="14" fill="var(--muted)">engineered full-stack wedding &amp; event management suite across Web and Mobile</text>
    <text class="mono" x="136" y="186" font-size="14" fill="var(--muted)">React Native · Next.js · real-time guest booking &amp; administrative control panels</text>
  </g>

  <g class="rise a3">
    <text class="mono" x="48" y="234" font-size="12" fill="var(--accent)" letter-spacing="2">2024</text>
    <text class="mono" x="136" y="234" font-size="15" fill="var(--bone)">Zukun Academy · UI/UX Design Alumni · Chennai</text>
    <text class="mono" x="136" y="260" font-size="14" fill="var(--muted)">intensive training in user experience design · user research · design systems · wireframing</text>
    <text class="mono" x="136" y="282" font-size="14" fill="var(--muted)">Figma product prototypes · user-first interface engineering</text>
  </g>

  <g class="rise a4">
    <text class="mono" x="48" y="330" font-size="12" fill="var(--accent)" letter-spacing="2">2022 – 25</text>
    <text class="mono" x="136" y="330" font-size="15" fill="var(--bone)">University of Madras · BCA Graduate (Bachelor of Computer Applications)</text>
    <text class="mono" x="136" y="356" font-size="14" fill="var(--muted)">specialized in web development, database management, and software systems</text>
  </g>
</svg>